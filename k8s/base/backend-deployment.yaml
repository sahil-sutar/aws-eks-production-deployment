apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-backend
  namespace: prod-namespace
  labels:
    app: flask-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flask-backend
  template:
    metadata:
      labels:
        app: flask-backend
    spec:
      containers:
      - name: flask-app
        image: sahilsutar/flask-app:latest
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: mysql-secret
        - configMapRef:
            name: flask-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10