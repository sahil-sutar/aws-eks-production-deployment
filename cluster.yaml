apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devops-microservices-eks
  region: ap-south-1
  version: "1.31"

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    ssh:
      allow: false